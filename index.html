<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeIQ</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f1ea;
    --ink: #1f2a27;
    --ink-secondary: #5c6763;
    --accent: #17362f;
    --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14201c;
      --ink: #eef1ef;
      --ink-secondary: #a7b3ae;
      --accent: #9fc4b8;
      --card: #1c2b26;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 2rem 1.25rem 4rem;
  }
  main { max-width: 42rem; margin: 0 auto; }
  h1 { font-size: 1.8rem; color: var(--accent); margin-bottom: 0.25rem; }
  .updated { color: var(--ink-secondary); font-size: 0.9rem; margin-bottom: 2rem; }
  section {
    background: var(--card);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
  }
  h2 { font-size: 1.1rem; margin-bottom: 0.5rem; }
  nav { margin-bottom: 2rem; }
  nav a, footer a { color: var(--accent); }
  ul { list-style: none; }
  li { margin-bottom: 0.75rem; }
  footer { margin-top: 2.5rem; color: var(--ink-secondary); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
<h1>HomeIQ</h1>
<p class="updated">The household record for your home.</p>
<section>
<h2>Legal</h2>
<ul>
<li><a href="./privacy.html">Privacy policy</a></li>
<li><a href="./terms.html">Terms of service</a></li>
</ul>
</section>
<section>
<h2>Support</h2>
<p>Questions or problems? Email <a href="mailto:neil@pasricha.ai">neil@pasricha.ai</a>.</p>
</section>
</main>
</body>
</html>
