<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HomeIQ — Opening the app</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f1ea;
    --ink: #1f2a27;
    --ink-secondary: #5c6763;
    --accent: #17362f;
    --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14201c;
      --ink: #eef1ef;
      --ink-secondary: #a7b3ae;
      --accent: #9fc4b8;
      --card: #1c2b26;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 2rem 1.25rem 4rem;
  }
  main { max-width: 26rem; margin: 10vh auto 0; text-align: center; }
  h1 { font-size: 1.6rem; color: var(--accent); margin-bottom: 0.75rem; }
  p { color: var(--ink-secondary); margin-bottom: 1.5rem; }
  a.button {
    display: inline-block;
    padding: 0.85rem 1.5rem;
    background: var(--accent);
    color: var(--bg);
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1 id="title">Opening HomeIQ…</h1>
  <p id="hint">If the app doesn't open on its own, tap the button. Use the device where HomeIQ is installed.</p>
  <a id="open" class="button hidden" href="#">Open HomeIQ</a>
  <p id="invalid" class="hidden">This link is incomplete. Open the email again and tap its button.</p>
</main>
<script>
  // Email clients such as Gmail on Android render custom-scheme links as plain
  // text, so emails point here over https and this page forwards to the app.
  // The one-time token travels in the URL fragment: it never reaches a server
  // log, and link scanners that prefetch the page cannot consume it because
  // only the app exchanges it.
  (function () {
    var params = new URLSearchParams(location.hash.replace(/^#/, ''));
    var token = params.get('token_hash');
    var type = params.get('type');
    var route = type === 'recovery' ? 'reset-password' : type === 'signup' || type === 'email' ? 'confirmed' : null;
    if (!token || !route) {
      document.getElementById('title').textContent = 'Link problem';
      document.getElementById('hint').classList.add('hidden');
      document.getElementById('invalid').classList.remove('hidden');
      return;
    }
    var target = 'homehq://' + route + '?token_hash=' + encodeURIComponent(token) + '&type=' + encodeURIComponent(type);
    var button = document.getElementById('open');
    button.href = target;
    button.classList.remove('hidden');
    location.replace(target);
  })();
</script>
</body>
</html>
