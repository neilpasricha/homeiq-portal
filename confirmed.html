<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>HomeIQ — Email confirmed</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f1ea;
        --ink: #1f2a27;
        --ink-secondary: #5c6763;
        --accent: #17362f;
        --card: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14201c;
          --ink: #eef1ef;
          --ink-secondary: #a7b3ae;
          --accent: #9fc4b8;
          --card: #1c2b26;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          17px/1.6 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        padding: 2rem 1.25rem 4rem;
      }
      main {
        max-width: 28rem;
        margin: 10vh auto 0;
        padding: 2rem 1.5rem;
        background: var(--card);
        border-radius: 16px;
        text-align: center;
      }
      h1 {
        color: var(--accent);
        font-size: 1.6rem;
        margin: 0 0 0.75rem;
      }
      p {
        color: var(--ink-secondary);
        margin: 0 0 1.25rem;
      }
      a.button {
        display: inline-block;
        padding: 0.85rem 1.5rem;
        background: var(--accent);
        color: var(--bg);
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Checking your link…</h1>
      <p id="message" aria-live="polite">Please wait.</p>
      <a id="open" class="button hidden" href="">Open HomeIQ</a>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var code = params.get("code");
        var error = params.get("error") || params.get("error_code");

        // A PKCE code is single-use and only useful with the verifier on the
        // device that started signup. Keep it in memory for the optional app
        // handoff, but remove it from the visible URL and browser history.
        history.replaceState({}, document.title, location.pathname);

        var title = document.getElementById("title");
        var message = document.getElementById("message");
        if (code && !error) {
          title.textContent = "Thanks for confirming your email";
          message.textContent =
            "Your HomeIQ account is ready. Return to HomeIQ on your phone and sign in. If you are on that phone now, you can open the app below.";
          if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var button = document.getElementById("open");
            button.href = "homehq://confirmed?code=" + encodeURIComponent(code);
            button.classList.remove("hidden");
          }
          return;
        }

        title.textContent = error
          ? "This confirmation link could not be used"
          : "Confirmation link missing";
        message.textContent =
          "The link may have expired or already been used. Return to HomeIQ and try signing in; if it asks you to confirm, request a new email.";
      })();
    </script>
  </body>
</html>
